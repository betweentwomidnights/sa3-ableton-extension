    }

    .lane-row {
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr);
      gap: 6px;
      min-width: 0;
    }

    .lane-head {
      display: grid;
      grid-template-rows: 22px 22px;
      align-content: start;
      gap: 3px;
      min-width: 0;
    }

    .lane-head-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24px;
      gap: 4px;
      min-width: 0;
    }

    .lane-name {
      height: 22px;
      line-height: 20px;
      padding: 0 5px;
      border: 1px solid var(--lane-color);
      background: var(--control);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lane-name[data-missing="true"] { color: var(--muted); }

    .lane-head button {
      min-width: 0;
      padding: 0;
    }

    .lane-row canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      cursor: crosshair;
      touch-action: none;
    }

    .lane-tip {
      position: fixed;
      z-index: 40;
      display: none;
      padding: 1px 5px;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      font-size: 10.5px;
      pointer-events: none;
      white-space: nowrap;
    }

    [hidden] { display: none !important; }

    .view {
      display: grid;
      gap: 8px;
    }

    .title-row,
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    h1 {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    .selection,
    .music,
    .muted {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      min-height: 15px;
      color: var(--muted);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .status[data-state="offline"] { color: #ff7d6e; }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px 76px 150px;
      gap: 8px;
    }

    .full { grid-column: 1 / -1; }
    .wide { grid-column: span 2; }

    .continue-only { display: none; }
    .generate-or-continue-only { display: none; }
    .shell[data-operation="continue"] .continue-only { display: grid; }
    .shell[data-operation="continue"] .generate-or-continue-only,
    .shell[data-operation="generate"] .generate-or-continue-only { display: grid; }
    .shell[data-operation="continue"] .transform-only { display: none; }
    .shell[data-operation="generate"] .transform-only { display: none; }

    label {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      height: 22px;
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--control);
      color: var(--text);
      padding: 0 6px;
      outline-offset: 0;
    }

    input:focus, select:focus {
      outline: 2px solid var(--muted);
    }

    select:disabled,
    input:disabled {
      opacity: 0.62;
      color: var(--muted);
      cursor: default;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }

    .prompt-row {
      display: grid;
      grid-template-columns: 1fr 50px;
      gap: 6px;
      min-width: 0;
    }

    .embedded-model-row {
      display: grid;
      grid-template-columns: minmax(140px, 1.5fr) minmax(90px, 1fr) minmax(90px, 1fr);
      align-items: end;
      gap: 6px;
      min-width: 0;
    }

    .settings-actions,
    .runtime-row,
    .decoder-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .settings-actions button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .runtime-row .health-status,
    .decoder-row .check-row { flex: 1 1 auto; }

    .settings-view { gap: 12px; }

    .settings-section {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #242424;
      background: #323232;
    }

    .settings-heading {
      color: var(--text);
      font-weight: 700;
    }

    .path-hint {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loudness-control {
      display: grid;
      grid-template-columns: 48px minmax(140px, 1fr) 58px;
      align-items: center;
      gap: 8px;
    }

    .value-label {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .health-status {
      min-width: 0;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .health-status[data-state="online"] { color: #8fd484; }
    .health-status[data-state="offline"] { color: #ff7d6e; }
    .health-status[data-state="pending"] { color: var(--accent); }

    .model-status {
      min-width: 0;
      height: 22px;
      line-height: 22px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-status[data-state="online"] { color: #8fd484; }
    .model-status[data-state="offline"] { color: #ff7d6e; }
    .model-status[data-state="pending"] { color: var(--accent); }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      min-height: 22px;
    }

    .check-row input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
    }

    .seed-cell {
      display: grid;
      grid-template-columns: 58px 1fr;
      grid-template-rows: 22px 14px;
      align-items: center;
      gap: 2px 6px;
      min-width: 0;
    }

    .seed-cell .check-row {
      grid-column: 1;
      grid-row: 1;
      min-height: 22px;
    }

    .seed-cell input[type="number"] {
      grid-column: 2;
      grid-row: 1;
    }

    .seed-note {
      grid-column: 1 / -1;
      grid-row: 2;
      min-width: 0;
      color: var(--muted);
      font-size: 10.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ending-control {
      gap: 4px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .segmented label {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: var(--control);
      color: var(--text);
      cursor: pointer;
    }

    .segmented input {
      width: 13px;
      height: 13px;
      accent-color: var(--accent);
    }

    .lora-rows {
      display: grid;
      gap: 5px;
      /* Five rows of 22 with their gaps; the list scrolls past that. */
      max-height: 130px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .lora-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(90px, 2fr) 34px 16px;
      grid-auto-rows: 22px;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .lora-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .lora-value {
      color: var(--muted);
      text-align: right;
    }

    .lora-remove {
      width: 16px;
      min-width: 0;
      height: 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
    }

    .lora-remove:hover { color: var(--text); }

    .lora-row.asking > .lora-slider,
    .lora-row.asking > .lora-value,
    .lora-row.asking > .lora-remove {
      display: none;
    }

    .lora-ask {
      grid-column: 2 / -1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      height: 22px;
      min-width: 50px;
      border: 1px solid var(--border);
      background: var(--control);
      color: var(--text);
      padding: 0 10px;
      cursor: pointer;
    }

    button:hover { background: var(--control-hover); }
    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    button.primary {
      min-width: 72px;
      background: var(--accent);
      color: var(--accent-text);
    }

    button.primary:hover { filter: brightness(1.04); }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="title-row">
      <h1 id="title">SA3 Transform</h1>
      <button id="settingsToggle" type="button">settings</button>
    </div>
    <input id="embeddedModelsDir" type="hidden">
    <input id="embeddedLorasDir" type="hidden">

    <div class="columns" id="columns" data-split="false">
    <div class="main-column">
    <div class="main-scroll">
    <section class="view" id="mainView">
      <div class="meta-row">
        <div class="selection" id="selection"></div>
        <div class="music" id="music"></div>
      </div>
      <div class="grid">
        <label class="full">
          prompt
          <div class="prompt-row">
            <div class="prompt-box" id="promptBox" role="textbox" tabindex="0"></div>
            <button id="diceButton" type="button" title="roll prompt">dice</button>
          </div>
        </label>
        <div class="key-row full">
          <label>
            key
            <select id="keyRoot" title="live follows Live's Scale Mode">
              <option value="-1">live</option>
              <option value="0">none</option>
              <option value="1">C</option>
              <option value="2">C#</option>
              <option value="3">D</option>
              <option value="4">D#</option>
              <option value="5">E</option>
              <option value="6">F</option>
              <option value="7">F#</option>
              <option value="8">G</option>
              <option value="9">G#</option>
              <option value="10">A</option>
              <option value="11">A#</option>
              <option value="12">B</option>
            </select>
          </label>
          <label>
            mode
            <select id="keyMode">
              <option value="0">major</option>
              <option value="1">minor</option>
            </select>
          </label>
          <label>
            meter
            <select id="meter" title="Live doesn't tell extensions the set's meter, so bars count from this">
              <option value="2/4">2/4</option>
              <option value="3/4">3/4</option>
              <option value="4/4">4/4</option>
              <option value="5/4">5/4</option>
              <option value="6/4">6/4</option>
              <option value="7/4">7/4</option>
              <option value="5/8">5/8</option>
              <option value="6/8">6/8</option>
              <option value="7/8">7/8</option>
              <option value="9/8">9/8</option>
              <option value="12/8">12/8</option>
            </select>
          </label>
        </div>
        <label class="wide transform-only">
          init noise
          <div class="range-row">
            <input id="strength" type="range" min="0.01" max="1" step="0.01">
            <span id="strengthValue"></span>
          </div>
        </label>
        <label class="wide continue-only">
          add bars
          <input id="continueBars" type="number" min="0.25" max="256" step="0.25">
        </label>
        <label>
          steps
          <input id="steps" type="number" min="4" max="16" step="1">
        </label>
        <label>
          cfg
          <input id="cfgScale" type="number" min="0.5" max="2" step="0.1">
        </label>
        <label>
          shift
          <select id="shift">
            <option value="full">full</option>
            <option value="default">default</option>
            <option value="none">none</option>
            <option value="logsnr">logsnr</option>
            <option value="flux">flux</option>
          </select>
        </label>
        <div class="seed-cell">
          <label class="check-row">
            <input id="useSeed" type="checkbox">
            seed
          </label>
          <input id="seed" type="number" step="1" placeholder="random">
          <div class="seed-note" id="lastSeed"></div>
        </div>
        <label class="full">
          negative
          <div class="prompt-box" id="negativeBox" role="textbox" tabindex="0" data-placeholder="low quality"></div>
        </label>
        <label class="check-row full transform-only">
          <input id="replaceSelection" type="checkbox">
          replace selection
        </label>
      </div>
      <div class="view ending-control generate-or-continue-only">
        <span>ending</span>
        <div class="segmented">
          <label><input type="radio" name="endingMode" value="ends-here"> ends here</label>
          <label><input type="radio" name="endingMode" value="keeps-going"> keeps going</label>
        </div>
      </div>
      <div class="lora-header">
        <div class="lora-title">loras</div>
        <button id="automationToggle" type="button">automation</button>
        <button id="loraImportFolder" type="button" title="add a lora from a folder holding its .gguf or .safetensors, its .json settings, and a prompts.json or .txt captions if it has them. the lora takes the folder's name">import folder</button>
        <button id="loraImport" type="button" title="add a single .gguf, or prompts kept somewhere else: a pool named after a lora goes to that lora, and anything else asks which">import files</button>
        <button id="lorasFolder" type="button" title="open where lora folders go; anything dropped in there shows up on its own">open folder</button>
        <input id="loraImportFolderInput" type="file" webkitdirectory hidden>
        <input id="loraImportFile" type="file" multiple accept=".gguf,.safetensors,.json,.txt" hidden>
        <input id="loraSettingsFile" type="file" accept=".json" hidden>
      </div>
      <div class="lora-rows" id="loraRows"></div>
      <div class="import-row" id="importRow" hidden>
        <span id="importCount"></span>
        <select id="importTarget"></select>
        <button id="importAdd" type="button">add</button>
        <button id="importCancel" type="button">cancel</button>
      </div>
      <div class="import-row" id="settingsRow" hidden>
        <button id="settingsChoose" type="button">choose settings file</button>
        <button id="settingsCancel" type="button">cancel</button>
      </div>
    </section>

    <section class="view settings-view" id="settingsView" hidden>
      <div class="settings-section">
        <div class="settings-heading">embedded runtime</div>
        <div class="runtime-row">
          <button id="healthCheck" type="button">check</button>
          <div class="health-status" id="healthStatus"></div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-heading">generation model</div>
        <div class="embedded-model-row">
          <label>
            model
            <select id="embeddedVariant">
              <option value="medium">medium</option>
              <option value="small-music">small-music</option>
              <option value="small-sfx">small-sfx</option>
            </select>
          </label>
          <label>
            encoding
            <select id="embeddedEncoding">
              <option value="f16">f16</option>
              <option value="f32">f32</option>
            </select>
          </label>
          <label>
            device
            <select id="embeddedDevice" title="auto uses the GPU when the build has one; cpu forces CPU">
              <option value="auto">auto</option>
              <option value="cpu">cpu</option>
            </select>
          </label>
        </div>
        <div class="settings-actions">
          <button id="embeddedModelsCheck" type="button">check</button>
          <button id="embeddedModelsDownload" type="button">download</button>
          <button id="embeddedModelsReveal" type="button">models folder</button>
          <button id="embeddedLorasReveal" type="button">loras folder</button>
        </div>
        <div class="model-status" id="embeddedModelsStatus"></div>
        <div class="path-hint" id="embeddedDirsHint"></div>
        <label class="check-row">
          <input id="keepModelsResident" type="checkbox">
          keep models resident
          <span class="muted">faster repeat runs, but continues occupying the selected device</span>
        </label>
      </div>
      <div class="settings-section decoder-card">
        <div class="settings-heading">SAME-L decoder correction</div>
        <div class="decoder-row">
          <label class="check-row">
            <input id="decoderLoraEnabled" type="checkbox">
            use decoder correction
          </label>
          <button id="decoderDownload" type="button">download</button>
        </div>
        <div class="model-status" id="decoderStatus"></div>
        <div class="muted">Reduces high-frequency buildup in transforms and continuations. Medium / SAME-L only.</div>
      </div>
      <div class="settings-section loudness-card">
        <div class="settings-heading">output processing</div>
        <div class="muted">Practical loudness controls applied after decoding.</div>
        <label class="check-row">
          <input id="peakNormalize" type="checkbox">
          peak normalize
        </label>
        <label class="loudness-control">
          <span>target</span>
          <input id="peakNormalizeDb" type="range" min="-6" max="6" step="0.1">
          <span class="value-label" id="peakNormalizeDbValue"></span>
        </label>
        <label class="check-row">
          <input id="limiter" type="checkbox">
          soft limiter
        </label>
        <label class="loudness-control">
          <span>ceiling</span>
          <input id="limiterCeilingDb" type="range" min="-6" max="0" step="0.1">
          <span class="value-label" id="limiterCeilingDbValue"></span>
        </label>
        <label class="loudness-control">
          <span>knee</span>
          <input id="limiterKnee" type="range" min="0.1" max="1" step="0.01">
          <span class="value-label" id="limiterKneeValue"></span>
        </label>
        <div class="settings-actions">
          <button id="loudnessDefaults" type="button">tuned defaults</button>
          <button id="loudnessRaw" type="button">raw</button>
        </div>
      </div>
    </section>
    </div>
    <div class="footer">
      <div class="buttons">
        <button id="cancelButton" type="button">Cancel</button>
        <button id="actionButton" class="primary" type="button">Transform</button>
      </div>
      <div class="status" id="status"></div>
      <div class="models-hint" id="modelsHint" hidden>
        <button id="hintDownloadMedium" type="button">download medium</button>
        <button id="hintDownloadSmall" type="button">download small-music</button>
        <button id="hintCancel" type="button" hidden>cancel download</button>
      </div>
    </div>
    </div>
    <section class="lane-panel" id="lanePanel" hidden>
      <div class="lane-bar">
        <h2>automation</h2>
        <div class="segments">
          <button id="laneBlendOne" type="button" title="the arrangement forms from each lane's average, then the curves apply">one song</button>
          <button id="laneBlendDistinct" type="button" title="sections hold apart more strongly while the structure forms">distinct</button>
        </div>
        <select id="laneSnap" title="what dragged points land on; ctrl steps the other way">
          <option value="0">snap off</option>
          <option value="1">snap 1/4</option>
          <option value="2">snap 1/2</option>
          <option value="3">snap 1 bar</option>
        </select>
        <div class="lane-range" id="laneRange"></div>
      </div>
      <div class="lane-take">
        <div class="lane-take-label" id="laneTakeLabel"></div>
        <canvas id="laneTake"></canvas>
      </div>
      <div class="lane-stack" id="laneStack"></div>
    </section>
    </div>
    <textarea id="promptOverlay" spellcheck="false"></textarea>
    <div class="lane-tip" id="laneTip"></div>
  </div>
</body>
</html>
